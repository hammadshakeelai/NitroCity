<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="NitroCity 3D - Forest and River Playground, Dusk Circuit Race">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24102e"/>
      <stop offset="55%" stop-color="#351a42"/>
      <stop offset="100%" stop-color="#4a2550"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff9f43" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#c0392b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#351a42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c8f42"/>
      <stop offset="35%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2c6b32"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ef0ec"/>
      <stop offset="45%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#019a9b"/>
    </linearGradient>
    <linearGradient id="fogband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#351a42" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#351a42" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d13a3a"/>
      <stop offset="55%" stop-color="#b32626"/>
      <stop offset="100%" stop-color="#7e1a1a"/>
    </linearGradient>
    <linearGradient id="nitro" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#e8fffe"/>
      <stop offset="30%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#00cec9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="50%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="leftveil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24102e" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#2b1436" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#351a42" stop-opacity="0"/>
    </linearGradient>

    <g id="pine" fill="currentColor">
      <rect x="-3" y="-14" width="6" height="16" fill="#4a2e18"/>
      <path d="M0 -66 L-19 -36 L19 -36 Z"/>
      <path d="M0 -48 L-25 -20 L25 -20 Z"/>
      <path d="M0 -32 L-31 -1 L31 -1 Z"/>
    </g>
    <g id="broadleaf" fill="currentColor">
      <rect x="-4" y="-18" width="8" height="20" fill="#543821"/>
      <circle cx="0" cy="-46" r="23"/>
      <circle cx="-18" cy="-32" r="17"/>
      <circle cx="18" cy="-34" r="16"/>
      <circle cx="0" cy="-26" r="15"/>
    </g>
    <g id="star5" fill="#ffd32a">
      <path d="M0 -15 L4.4 -4.6 L15 -3.2 L7.2 4.2 L9.2 15 L0 9.8 L-9.2 15 L-7.2 4.2 L-15 -3.2 L-4.4 -4.6 Z"/>
    </g>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="330" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ================= SKY ================= -->
    <rect width="1200" height="330" fill="url(#sky)"/>
    <ellipse cx="880" cy="215" rx="520" ry="200" fill="url(#dusk)"/>

    <!-- ================= FAR TREELINE (fogged) ================= -->
    <g opacity="0.42">
      <use href="#pine" x="60"   y="212" transform="translate(0,0) scale(1)" color="#1e824c"/>
      <use href="#pine" x="128"  y="216" color="#218c74"/>
      <use href="#pine" x="196"  y="210" color="#1b8a5a"/>
      <use href="#pine" x="272"  y="215" color="#1e824c"/>
      <use href="#pine" x="352"  y="211" color="#218c74"/>
      <use href="#pine" x="430"  y="216" color="#1b8a5a"/>
      <use href="#pine" x="512"  y="212" color="#1e824c"/>
      <use href="#pine" x="596"  y="215" color="#218c74"/>
      <use href="#pine" x="676"  y="210" color="#1b8a5a"/>
      <use href="#pine" x="758"  y="214" color="#1e824c"/>
      <use href="#pine" x="840"  y="211" color="#218c74"/>
      <use href="#pine" x="922"  y="215" color="#1b8a5a"/>
      <use href="#pine" x="1004" y="212" color="#1e824c"/>
      <use href="#pine" x="1086" y="216" color="#218c74"/>
      <use href="#pine" x="1160" y="212" color="#1b8a5a"/>
      <use href="#broadleaf" x="96"  y="214" color="#c0392b"/>
      <use href="#broadleaf" x="316" y="214" color="#d35400"/>
      <use href="#broadleaf" x="556" y="213" color="#e67e22"/>
      <use href="#broadleaf" x="800" y="214" color="#c0392b"/>
      <use href="#broadleaf" x="1044" y="213" color="#d35400"/>
    </g>
    <rect x="0" y="150" width="1200" height="86" fill="url(#fogband)"/>

    <!-- ================= MID TREELINE ================= -->
    <g opacity="0.95">
      <use href="#pine" x="34"   y="240" transform="scale(1)" color="#1e824c"/>
      <use href="#broadleaf" x="104" y="242" color="#d35400"/>
      <use href="#pine" x="176"  y="238" color="#218c74"/>
      <use href="#broadleaf" x="246" y="243" color="#e67e22"/>
      <use href="#pine" x="322"  y="240" color="#1b8a5a"/>
      <use href="#broadleaf" x="392" y="241" color="#ff9ff3"/>
      <use href="#pine" x="466"  y="239" color="#1e824c"/>
      <use href="#broadleaf" x="540" y="243" color="#c0392b"/>
      <use href="#pine" x="614"  y="240" color="#218c74"/>
      <use href="#broadleaf" x="686" y="241" color="#f1c40f"/>
      <use href="#pine" x="760"  y="238" color="#10ac84"/>
      <use href="#broadleaf" x="1128" y="242" color="#d35400"/>
      <use href="#pine" x="1188" y="240" color="#1e824c"/>
    </g>

    <!-- ================= RIVER ================= -->
    <path d="M0 244 Q 150 236 300 244 T 600 244 T 900 244 T 1200 240 L1200 268 Q 1050 276 900 268 T 600 268 T 300 268 T 0 272 Z" fill="url(#water)"/>
    <g fill="#e8fffe" opacity="0.55">
      <rect x="70"  y="252" width="54" height="4" rx="2"/>
      <rect x="210" y="258" width="38" height="4" rx="2"/>
      <rect x="330" y="250" width="60" height="4" rx="2"/>
      <rect x="470" y="259" width="42" height="4" rx="2"/>
      <rect x="1080" y="252" width="56" height="4" rx="2"/>
    </g>

    <!-- wooden bridge -->
    <g>
      <rect x="150" y="240" width="132" height="12" rx="2" fill="#6b4423" stroke="#3d271d" stroke-width="3"/>
      <g fill="#3d271d" opacity="0.6">
        <rect x="164" y="240" width="4" height="12"/>
        <rect x="188" y="240" width="4" height="12"/>
        <rect x="212" y="240" width="4" height="12"/>
        <rect x="236" y="240" width="4" height="12"/>
        <rect x="260" y="240" width="4" height="12"/>
      </g>
      <rect x="150" y="230" width="132" height="5" rx="2" fill="#8a5a2f"/>
      <rect x="156" y="230" width="5" height="14" fill="#3d271d"/>
      <rect x="272" y="230" width="5" height="14" fill="#3d271d"/>
    </g>

    <!-- ================= MEADOW FOREGROUND ================= -->
    <path d="M0 266 Q 300 258 600 264 T 1200 262 L1200 330 L0 330 Z" fill="url(#meadow)"/>

    <!-- stunt ramp -->
    <g>
      <path d="M470 300 L556 300 L556 268 Z" fill="#d97757" stroke="#1e1124" stroke-width="4" stroke-linejoin="round"/>
      <path d="M470 300 L556 300 L556 294 L470 300 Z" fill="#1e1124" opacity="0.35"/>
    </g>
    <!-- boost pad -->
    <g fill="#00d2d3" opacity="0.9">
      <path d="M596 292 l16 0 l13 8 l-13 8 l-16 0 l13 -8 Z"/>
      <path d="M624 292 l16 0 l13 8 l-13 8 l-16 0 l13 -8 Z"/>
      <path d="M652 292 l16 0 l13 8 l-13 8 l-16 0 l13 -8 Z"/>
    </g>
    <!-- crates -->
    <g>
      <rect x="1112" y="278" width="34" height="34" rx="3" fill="#ffbe76" stroke="#1e1124" stroke-width="4"/>
      <path d="M1112 295 L1146 295 M1129 278 L1129 312" stroke="#1e1124" stroke-width="3" opacity="0.45"/>
      <rect x="1150" y="292" width="26" height="26" rx="3" fill="#ffbe76" stroke="#1e1124" stroke-width="4"/>
    </g>
    <!-- grass tufts -->
    <g stroke="#2c6b32" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M60 320 l0 -12 M66 320 l4 -10 M54 320 l-4 -10"/>
      <path d="M300 316 l0 -11 M306 316 l4 -9 M294 316 l-4 -9"/>
      <path d="M700 322 l0 -12 M706 322 l4 -10 M694 322 l-4 -10"/>
      <path d="M980 318 l0 -11 M986 318 l4 -9 M974 318 l-4 -9"/>
    </g>

    <!-- collectible stars -->
    <use href="#star5" x="0" y="0" transform="translate(716,74) scale(1.35)"/>
    <use href="#star5" x="0" y="0" transform="translate(1142,116) scale(0.95)" opacity="0.75"/>
    <use href="#star5" x="0" y="0" transform="translate(892,44) scale(0.7)" opacity="0.5"/>

    <!-- speed / wind streaks -->
    <g fill="#e8fffe" opacity="0.22">
      <rect x="560" y="150" width="118" height="5" rx="2.5"/>
      <rect x="612" y="176" width="80"  height="4" rx="2"/>
      <rect x="548" y="202" width="140" height="5" rx="2.5"/>
    </g>

    <!-- ================= THE 4x4 BUGGY ================= -->
    <g>
      <!-- cyan nitro flames from twin exhausts -->
      <path d="M748 190 q -46 -12 -78 2 q 44 6 60 8 Z" fill="url(#nitro)" opacity="0.9"/>
      <path d="M748 200 q -62 -3 -100 12 q 60 -1 86 -3 Z" fill="url(#nitro)"/>
      <path d="M748 210 q -44 8 -68 20 q 46 -8 66 -10 Z" fill="url(#nitro)" opacity="0.75"/>

      <!-- ground shadow -->
      <ellipse cx="900" cy="288" rx="182" ry="12" fill="#1a0d20" opacity="0.45"/>

      <!-- suspension arms -->
      <g stroke="#1e272e" stroke-width="9" stroke-linecap="round">
        <path d="M838 226 L806 244"/>
        <path d="M965 226 L1001 244"/>
      </g>

      <!-- high-clearance dark chassis -->
      <rect x="744" y="188" width="312" height="40" rx="6" fill="#1e272e"/>

      <!-- crimson body -->
      <path d="M764 199 L1044 199 Q1052 199 1052 207 L1052 224 Q1052 232 1044 232 L764 232 Q756 232 756 224 L756 207 Q756 199 764 199 Z" fill="url(#paint)" stroke="#1e1124" stroke-width="5" stroke-linejoin="round"/>

      <!-- angular hood + scoop -->
      <path d="M920 152 L1037 152 Q1044 152 1044 159 L1044 172 L920 172 Z" fill="url(#paint)" stroke="#1e1124" stroke-width="5" stroke-linejoin="round"/>
      <rect x="946" y="140" width="62" height="14" rx="3" fill="#1e272e" stroke="#1e1124" stroke-width="4"/>

      <!-- cabin -->
      <path d="M828 100 L950 100 Q958 100 958 108 L958 176 L822 176 L822 108 Q822 100 828 100 Z" fill="url(#paint)" stroke="#1e1124" stroke-width="5" stroke-linejoin="round"/>
      <!-- tinted side glass -->
      <rect x="838" y="112" width="106" height="42" rx="4" fill="#1e272e" stroke="#0f1418" stroke-width="4"/>
      <path d="M842 116 L892 116 L862 150 L842 150 Z" fill="#7ef0ec" opacity="0.18"/>
      <!-- raked windscreen -->
      <path d="M958 112 L986 150 L958 150 Z" fill="#1e272e" stroke="#0f1418" stroke-width="4" stroke-linejoin="round"/>

      <!-- tubular roll cage -->
      <g stroke="#111827" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M826 96 L956 96"/>
        <path d="M828 100 L828 118"/>
        <path d="M954 100 L954 118"/>
        <path d="M840 96 L862 74 L928 74 L950 96"/>
      </g>

      <!-- 4 amber roof spotlights -->
      <g>
        <rect x="866" y="60" width="60" height="15" rx="3" fill="#1e272e" stroke="#111827" stroke-width="3"/>
        <g fill="#ffa801">
          <rect x="870" y="62" width="11" height="11" rx="2"/>
          <rect x="885" y="62" width="11" height="11" rx="2"/>
          <rect x="900" y="62" width="11" height="11" rx="2"/>
          <rect x="915" y="62" width="11" height="11" rx="2"/>
        </g>
        <!-- amber beam -->
        <path d="M926 60 L1046 32 L1046 84 L926 76 Z" fill="#ff9f43" opacity="0.16"/>
      </g>

      <!-- dark fenders over wheels -->
      <path d="M770 196 L846 196 L846 214 L770 214 Z" fill="#222f3e"/>
      <path d="M960 196 L1040 196 L1040 214 L960 214 Z" fill="#222f3e"/>

      <!-- rear tail lights (purple-red emissive) -->
      <rect x="752" y="204" width="14" height="16" rx="3" fill="#d63031" stroke="#1e1124" stroke-width="3"/>
      <!-- twin exhaust pipes -->
      <g fill="#1e272e" stroke="#111827" stroke-width="3">
        <rect x="738" y="192" width="16" height="11" rx="5"/>
        <rect x="738" y="208" width="16" height="11" rx="5"/>
      </g>

      <!-- heavy front bullbar + winch -->
      <path d="M1052 190 L1074 194 Q1082 196 1082 204 L1082 226 Q1082 232 1074 232 L1052 232 Z" fill="#111827" stroke="#0b0f18" stroke-width="4" stroke-linejoin="round"/>
      <!-- wide amber grill light bar -->
      <rect x="1050" y="199" width="34" height="15" rx="4" fill="#ffa801" stroke="#111827" stroke-width="4"/>
      <path d="M1084 206 L1174 186 L1174 226 L1084 214 Z" fill="#ff9f43" opacity="0.2"/>

      <!-- giant chunky off-road tires -->
      <g>
        <!-- rear -->
        <circle cx="806" cy="234" r="51" fill="#1e272e"/>
        <g fill="#1e272e">
          <rect x="800" y="177" width="12" height="12" rx="2"/>
          <rect x="843" y="192" width="12" height="12" rx="2" transform="rotate(45 849 198)"/>
          <rect x="855" y="228" width="12" height="12" rx="2"/>
          <rect x="843" y="264" width="12" height="12" rx="2" transform="rotate(45 849 270)"/>
          <rect x="800" y="279" width="12" height="12" rx="2"/>
          <rect x="757" y="264" width="12" height="12" rx="2" transform="rotate(45 763 270)"/>
          <rect x="745" y="228" width="12" height="12" rx="2"/>
          <rect x="757" y="192" width="12" height="12" rx="2" transform="rotate(45 763 198)"/>
        </g>
        <circle cx="806" cy="234" r="30" fill="#d63031"/>
        <circle cx="806" cy="234" r="17" fill="#2d3436"/>
        <!-- front -->
        <circle cx="1001" cy="234" r="51" fill="#1e272e"/>
        <g fill="#1e272e">
          <rect x="995" y="177" width="12" height="12" rx="2"/>
          <rect x="1038" y="192" width="12" height="12" rx="2" transform="rotate(45 1044 198)"/>
          <rect x="1050" y="228" width="12" height="12" rx="2"/>
          <rect x="1038" y="264" width="12" height="12" rx="2" transform="rotate(45 1044 270)"/>
          <rect x="995" y="279" width="12" height="12" rx="2"/>
          <rect x="952" y="264" width="12" height="12" rx="2" transform="rotate(45 958 270)"/>
          <rect x="940" y="228" width="12" height="12" rx="2"/>
          <rect x="952" y="192" width="12" height="12" rx="2" transform="rotate(45 958 198)"/>
        </g>
        <circle cx="1001" cy="234" r="30" fill="#d63031"/>
        <circle cx="1001" cy="234" r="17" fill="#2d3436"/>
      </g>
    </g>

    <!-- ================= LEFT VEIL FOR TEXT LEGIBILITY ================= -->
    <rect x="0" y="0" width="640" height="330" fill="url(#leftveil)"/>

    <!-- ================= WORDMARK ================= -->
    <g font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif">
      <text x="66" y="132" font-size="84" textLength="418" lengthAdjust="spacingAndGlyphs" fill="#12060f" opacity="0.8">NITROCITY</text>
      <text x="62" y="128" font-size="84" textLength="418" lengthAdjust="spacingAndGlyphs" stroke="#1e1124" stroke-width="9" paint-order="stroke fill"><tspan fill="url(#wordmark)">NITRO</tspan><tspan fill="#f5f6fa">CITY</tspan></text>
      <rect x="492" y="76" width="80" height="56" rx="12" fill="#00cec9" stroke="#1e1124" stroke-width="6"/>
      <text x="532" y="119" font-size="40" fill="#12303a" text-anchor="middle">3D</text>
    </g>

    <text x="66" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffd9a0" letter-spacing="3.4">&#127795; FOREST &amp; RIVER PLAYGROUND</text>
    <text x="66" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="bold" fill="#7ef0ec" letter-spacing="3.4">&#127937; DUSK CIRCUIT RACE</text>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold">
      <rect x="64" y="222" width="118" height="28" rx="14" fill="#1e1124" stroke="#5b3a63" stroke-width="2"/>
      <text x="123" y="241" fill="#f5f6fa" text-anchor="middle">THREE.JS r128</text>
      <rect x="190" y="222" width="126" height="28" rx="14" fill="#1e1124" stroke="#5b3a63" stroke-width="2"/>
      <text x="253" y="241" fill="#f5f6fa" text-anchor="middle">NO BUILD STEP</text>
      <rect x="324" y="222" width="116" height="28" rx="14" fill="#1e1124" stroke="#5b3a63" stroke-width="2"/>
      <text x="382" y="241" fill="#f5f6fa" text-anchor="middle">PWA / MOBILE</text>
    </g>

    <rect x="2" y="2" width="1196" height="326" rx="16" fill="none" stroke="#5b3a63" stroke-width="4"/>
  </g>
</svg>
